name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Quartz can use git dates

      - name: Clone Quartz v4
        run: git clone --depth 1 -b v4 https://github.com/jackyzha0/quartz.git .quartz

      - name: Install Quartz dependencies
        run: npm ci
        working-directory: .quartz

      - name: Copy vault configs into Quartz
        run: |
          cp quartz.config.ts .quartz/quartz.config.ts
          cp quartz.layout.ts .quartz/quartz.layout.ts
          cp custom.scss .quartz/quartz/styles/custom.scss

      - name: Build
        run: npx quartz build --directory ${{ github.workspace }}/wiki
        working-directory: .quartz

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
